<!doctype html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contacto | The Cabinet</title>

  <link rel="stylesheet" href="styles.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body class="contact-page">

<header class="main-header">

  <nav class="navbar-custom">

    <a href="index.html" class="logo">
      THE CABINET
    </a>

    <div class="nav-links">

      <a href="index.html">Inicio</a>

      <a href="tienda.html">Tienda</a>

      <a href="about.html">Acerca</a>

      <a href="contact.html">Contacto</a>

      <a href="carrito.html">Carrito</a>

      <a href="login.html" id="userLink">
        Cuenta
      </a>

    </div>

  </nav>

</header>

<section class="contact-section">

  <div class="contact-box">

    <h1>
      Contactar al Archivo
    </h1>

    <p>
      Envíanos dudas, comentarios o reliquias cinematográficas.
    </p>

    <form id="contactForm">

      <input
        type="text"
        id="nombre"
        placeholder="Nombre"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Correo"
        required
      >

      <textarea
        id="mensaje"
        placeholder="Mensaje"
        required
      ></textarea>

      <button type="submit">
        Enviar mensaje
      </button>

    </form>

    <p id="feedback"></p>

  </div>

</section>

<script type="module">

import { db, auth } from "./js/firebase.js";

import {

  ref,
  push

} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

import {

  onAuthStateChanged,
  signOut

} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

const form = document.getElementById("contactForm");

const feedback = document.getElementById("feedback");

const userLink = document.getElementById("userLink");

onAuthStateChanged(auth, (user) => {

  if(user){

    userLink.textContent = user.email;

    userLink.href = "#";

    userLink.addEventListener("click", async () => {

      await signOut(auth);

      window.location.reload();

    });

  }

});

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const nombre = document.getElementById("nombre").value;

  const email = document.getElementById("email").value;

  const mensaje = document.getElementById("mensaje").value;

  try{

    const mensajesRef = ref(db, "mensajes");

    await push(mensajesRef, {

      nombre,
      email,
      mensaje

    });

    feedback.textContent = "Mensaje enviado";

    form.reset();

  }catch(error){

    feedback.textContent = "Error al enviar";

  }

});

</script>

</body>
</html>
