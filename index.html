<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi sitio con navegación</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">


  <!-- Menú -->
  <style>
    nav a {
      color: #b91c1c; /* rojo */
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    nav a:hover {
      color: #7f1d1d; /* rojo más oscuro */
      text-decoration: underline;
    }
  </style>
</head>

<body class="bg-light">

  <!-- Header fijo con navegación -->
  <header class="bg-white border-bottom sticky-top">
    <div class="container py-3 d-flex justify-content-between align-items-center">
      <h1 class="h4 m-0 text-danger">Mi sitio</h1>

      <nav class="d-flex gap-3">
        <a href="index.html">Inicio</a>
        <a href="about.html">Acerca</a>
        <a href="contact.html">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="container py-5">

    <section 
      id="inicio" 
      class="p-4 rounded-4 shadow-sm border-start border-5 border-danger">
      <h2 class="text-danger">Inicio</h2>
      <p>Mensaje principal del sitio.</p>
    </section>

    <section 
      id="acerca" 
      class="mt-4 p-4 rounded-4 shadow-sm border-start border-5 border-danger">
      <h2 class="text-danger">Acerca</h2>
      <p>Información sobre el proyecto o el autor.</p>
    </section>

    <section 
      id="contacto" 
      class="mt-4 bg-white p-4 rounded-4 shadow-sm border-start border-5 border-danger">
      <h2 class="text-danger">Contacto</h2>
      <p>correo@ejemplo.com</p>
    </section>

  </main>

  <footer class="bg-danger text-white">
    <div class="container py-3 text-center">
      <small>© 2026 · Mi sitio</small>
    </div>
  </footer>

</body>
</html>
